  # 深噬之域
  - id: 122041
    rawDescription: |
      我方$[K56]或$[K57]的手牌，会被吞噬。
      <color=#FFFFFFFF>每吞噬3张牌：</color>$[A2204]获得1点额外最大生命；如果其中存在$[K3002]相同的牌，则额外获得1点；如果3张均相同，再额外获得1点。
  # 黑色幻影
  - id: 122043
    rawDescription: |
      <color=#FFFFFFFF>入场时：</color>获得我方已吞噬卡牌中最高$[K3002]的「攻击力」，获得该费用的已吞噬卡牌数量的$[K3]。
      <color=#FFFFFFFF>结束阶段和我方宣布结束时：</color>造成此牌「攻击力」值的$[K104]。
      <color=#FFFFFFFF>我方出战角色受到伤害时：</color>抵消1点伤害，然后此牌$[K3]-2。
  # 噬骸能量块
  - id: 124051
    rawDescription: |
      随机$[K56]1张$[K3002]最高的手牌，生成1个我方出战角色类型的元素骰。如果我方出战角色是「{SPRITE_PRESET#3506}圣骸兽」角色，则使其获得1点$[K310]。（每回合最多打出1张）
  # 多重瞄准
  - id: 1151121
    rawDescription: |
      消耗1点<color=#FFFFFFFF>「夜魂值」</color>，造成$[D__KEY__DAMAGE]点$[D__KEY__ELEMENT]，然后随机$[K56]3张$[K3002]最高的手牌。
  # 钩物巧技
  - id: 3130021
    rawDescription: |
      造成1点$[K100]，窃取1张$[K3002]最高的对方手牌。
      如果我方手牌数不多于2，此特技少花费1个元素骰。
  # 雷元素伤害
