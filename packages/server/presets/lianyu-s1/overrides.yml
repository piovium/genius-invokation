      {SPRITE_PRESET#2104}{SPRITE_PRESET#2102}<color=#FFFFFFFF>感电</color>：没有效果
      {SPRITE_PRESET#2104}{SPRITE_PRESET#2107}<color=#FFFFFFFF>原激化</color>：生成使下3次草元素或雷元素伤害+1的[<color=#FFFFFFFF>激化领域</color>]
