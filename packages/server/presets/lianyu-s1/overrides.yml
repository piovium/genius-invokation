  # 婕德
  - id: 322022
    rawDynamicDescription: |
      此牌会记录本场对局中我方支援区弃置卡牌的数量，称为「阅历」。（最多6点，<color=#D3BC8EFF>当前为${[GCG_TOKEN_COUNTER]}点</color>）
      <color=#FFFFFFFF>我方角色使用「元素爆发」后：</color>如果「阅历」至少为5，则弃置此牌，生成<color=#FFFFFFFF>「阅历」-2</color>数量的$[K411]。
  # 苦舎桓
  - id: 323008
    rawDescription: |
      <color=#FFFFFFFF>行动阶段开始时：</color>$[K56]最多2张$[K3002]最高的手牌，每$[K56]1张，此牌就累积1点<color=#FFFFFFFF>「记忆和梦」</color>。（最多2点）
      <color=#FFFFFFFF>我方角色使用技能时：</color>如果我方本回合未打出过行动牌，则消耗1点<color=#FFFFFFFF>「记忆和梦」</color>，以使此技能少花费1个元素骰。
  # 兽肉薄荷卷
  - id: 333008
    rawDescription: |
      目标角色在本回合结束前，<color=#FFFFFFFF>「普通攻击」</color>少花费1个$[K309]。
      （每回合每个角色最多食用1次「{SPRITE_PRESET#3101}料理」）
  # 迸发扫描
  - id: 117082
    rawDescription: |
      <color=#FFFFFFFF>双方选择行动前：</color>如果我方场上存在$[C116]或$[C112082]，则使其$[K3]-1，并$[K56]我方牌库顶的1张卡牌。然后，造成所$[K56]卡牌$[K3002]+1的$[K107]。
      <color=#FFFFFFFF>$[K3]：1</color>（可叠加，最多叠加到3次）
  # 重云天赋
  - id: 211041
    rawDescription: |
      $[K1]：我方出战角色为<color=#FFFFFFFF>$[A1104]</color>时，装备此牌。
      $[A1104]装备此牌后，立刻使用一次<color=#FFD780FF>$[S11042]</color>。
      装备有此牌的$[A1104]生成的<color=#FFFFFFFF>$[C111041]</color>获得以下效果：
      初始$[K4]+1，并且使我方单手剑、双手剑或长柄武器角色的<color=#FFFFFFFF>普通攻击</color>伤害+1。
      （牌组中包含$[A1104]，才能加入牌组）
    rawPlayingDescription: |
      装备有此牌的$[A1104]生成的<color=#FFFFFFFF>$[C111041]</color>获得以下效果：
      初始$[K4]+1，并且使我方单手剑、双手剑或长柄武器角色的<color=#FFFFFFFF>普通攻击</color>伤害+1。
  # 夜域赐礼·索报皆偿
  - id: 217091
    rawDescription: |
      装备有此牌的<color=#FFFFFFFF>$[A1709]</color>切换至前台或使用<color=#FFFFFFFF>$[S17092]</color>时：若我方手牌不多于对方，则窃取1张$[K3002]最高的对方手牌，然后对手抓1张牌。（每回合1次）
      （牌组中包含$[A1709]，才能加入牌组）
    rawPlayingDescription: |
