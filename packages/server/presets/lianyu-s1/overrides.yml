  # 无光鲸噬
  - id: 217091
    rawDescription: |
      $[K1]：我方出战角色为<color=#FFFFFFFF>$[A2204]</color>时，装备此牌。
      $[A2204]装备此牌后，立刻使用一次<color=#FFD780FF>$[S22042]</color>。
      装备有此牌的$[A2204]使用<color=#FFFFFFFF>$[S22042]</color>$[K56]1张手牌后：治疗此角色，其数值等同于所$[K56]手牌的$[K3002]。（每回合1次）
      （牌组中包含$[A2204]，才能加入牌组）
