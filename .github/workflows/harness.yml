name: Harness integrity and failure tests
on:
  push:
  pull_request:
jobs:
  harness-controls:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run harness:verify
      - run: npm run harness:selftest
