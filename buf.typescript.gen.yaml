# `build:ts-proto` in packages/typings runs `buf generate --template
# buf.typescript.gen.yaml`; the template points the ts-proto plugin at the
# workspace's pinned copy instead of the remote one. Keep its `opt` list in step
# with the ts-proto block in buf.gen.yaml.
version: v2
managed:
  enabled: true
plugins:
  - local: [node, packages/typings/node_modules/ts-proto/protoc-gen-ts_proto]
    out: packages/typings/src/gen
    opt:
      - outputJsonMethods=false
      - unrecognizedEnum=false
      - exportCommonSymbols=false
      - removeEnumPrefix=true
      - oneof=unions-value
