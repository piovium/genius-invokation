# `buf generate --typescript` (packages/typings' `build:ts-proto`) uses this
# template so the workspace's pinned ts-proto plugin runs instead of the remote
# one; keep its `opt` list in step with the ts-proto block in buf.gen.yaml.
version: v2
managed:
  enabled: true
plugins:
  - local: [node, packages/typings/node_modules/ts-proto/protoc-gen-ts_proto]
    out: packages/typings/src/gen
    opt:
      - outputJsonMethods=false
      - unrecognizedEnum=false
      - exportCommonSymbols=false
      - removeEnumPrefix=true
      - oneof=unions-value
